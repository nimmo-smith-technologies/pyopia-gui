name: Build native app

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write # only needed to publish release assets when triggered by a tag

jobs:
  build:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # Older than ubuntu-latest deliberately: a PyInstaller build links against
          # the build machine's glibc, and glibc is backward- but not
          # forward-compatible - a binary built on a newer glibc than the user's
          # system refuses to run. ubuntu-22.04 (glibc 2.35) is the oldest Ubuntu
          # GitHub still hosts (20.04 has been retired); confirmed this reproduces
          # and fixes a real "GLIBC_2.38 not found" failure on Debian 12/LMDE 6
          # (glibc 2.36) using the previous ubuntu-latest (24.04, glibc 2.39) build.
          - os: ubuntu-22.04
            artifact-name: pyopia-gui-linux
            dist-path: dist/pyopia-gui-linux.zip
          - os: macos-latest
            artifact-name: pyopia-gui-macos
            dist-path: dist/pyopia-gui-macos.zip
            icon-path: assets/icon.icns
          - os: windows-latest
            artifact-name: pyopia-gui-windows
            dist-path: dist/pyopia-gui.exe
            icon-path: assets/icon.ico

    steps:
      - name: Check out source repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.0

      - name: Install dependencies
        run: uv sync --group native

      - name: Build (macOS)
        if: runner.os == 'macOS'
        run: >
          uv run nicegui-pack --name pyopia-gui --onefile --windowed
          --osx-bundle-identifier com.nimmosmithtechnologies.pyopia-gui
          --icon ${{ matrix.icon-path }}
          src/pyopia_gui/native_app.py

      - name: Zip the .app bundle (macOS)
        if: runner.os == 'macOS'
        # actions/upload-artifact uploads a directory's *contents*, not the directory
        # itself - zipping first keeps the pyopia-gui.app wrapper intact so Finder
        # recognises it as an app after unzipping.
        run: cd dist && zip -r -X pyopia-gui-macos.zip pyopia-gui.app

      - name: Build (Linux)
        # PyInstaller's --icon is a no-op on Linux ("Ignoring icon; supported only on
        # Windows and macOS!", confirmed via a real build) - there's no equivalent
        # embedding mechanism for a plain binary here, so it's omitted rather than
        # passed pointlessly.
        if: runner.os == 'Linux'
        run: uv run nicegui-pack --name pyopia-gui --onefile --windowed src/pyopia_gui/native_app.py

      - name: Build (Windows)
        if: runner.os == 'Windows'
        run: >
          uv run nicegui-pack --name pyopia-gui --onefile --windowed
          --icon ${{ matrix.icon-path }}
          src/pyopia_gui/native_app.py

      - name: Zip the binary with execute permission set (Linux)
        if: runner.os == 'Linux'
        # zip doesn't preserve the execute bit unless it's already set going in.
        run: cd dist && chmod +x pyopia-gui && zip -X pyopia-gui-linux.zip pyopia-gui

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact-name }}
          path: ${{ matrix.dist-path }}

      # Only on an actual version tag (not workflow_dispatch): publish straight to the
      # matching GitHub Release, so there's no manual download-from-CI-then-reupload
      # step. Safe to run once per matrix platform - it appends to the same release.
      - name: Publish to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: ${{ matrix.dist-path }}
