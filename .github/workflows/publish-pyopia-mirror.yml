name: Publish PyOPIA image mirror

# Temporary stopgap: ghcr.io/sintef/pyopia is not currently publicly pullable
# (https://github.com/SINTEF/pyopia/issues/424). This builds PyOPIA's own,
# unmodified Dockerfile from their public source and publishes it under our
# own namespace, so pyopia-gui has a working default image while that's
# unresolved upstream. See docs/decisions/ for the full reasoning - drop this
# workflow and revert docker_client.py's default once the upstream image is
# public again.

on:
  workflow_dispatch:
    inputs:
      pyopia_ref:
        description: >-
          PyOPIA git ref to build (tag, branch, or commit). No tagged release
          currently includes the Dockerfile (it postdates v2.0.3, PyOPIA's latest
          release) - "main" is the only ref that has it right now.
        required: true
        default: "main"

permissions:
  contents: read
  packages: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out PyOPIA source
        uses: actions/checkout@v7
        with:
          repository: SINTEF/pyopia
          ref: ${{ inputs.pyopia_ref }}

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        # Tagged with the run ID only for now, not :latest yet - pyopia_ref can be an
        # older commit (e.g. to backfill a version tag for testing), and :latest must
        # never regress to something older than whatever it already points at.
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          load: true
          tags: ghcr.io/nimmo-smith-technologies/pyopia:build-${{ github.run_id }}

      - name: Tag with PyOPIA's own version, and advance :latest only if this is newer
        # pyopia-gui pins projects to a specific PyOPIA version once they have output (see
        # docker_client.py) - that needs a real, immutable tag to pin to, not just the
        # floating :latest. The image's ENTRYPOINT is already ["pyopia"], so "--version" is
        # passed straight to it (not "pyopia --version", which pyopia's CLI itself rejects
        # as an unknown subcommand called "pyopia") - it prints "PyOPIA version: X.Y.Z".
        run: |
          build_tag=ghcr.io/nimmo-smith-technologies/pyopia:build-${{ github.run_id }}
          version=$(docker run --rm "$build_tag" --version | awk '{print $NF}')
          echo "PyOPIA version: $version"
          docker buildx imagetools create --tag ghcr.io/nimmo-smith-technologies/pyopia:"$version" "$build_tag"

          current_latest=$(docker run --rm ghcr.io/nimmo-smith-technologies/pyopia:latest --version 2>/dev/null | awk '{print $NF}' || echo "0")
          newest=$(printf '%s\n%s\n' "$current_latest" "$version" | sort -V | tail -1)
          if [ "$newest" = "$version" ] && [ "$version" != "$current_latest" ]; then
            echo "Advancing :latest ($current_latest -> $version)"
            docker buildx imagetools create --tag ghcr.io/nimmo-smith-technologies/pyopia:latest "$build_tag"
          else
            echo "Not touching :latest - it's already at $current_latest, not older than this build ($version)"
          fi
