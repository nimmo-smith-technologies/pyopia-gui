[project]
name = "pyopia-gui"
dynamic = ["version"]
description = "A graphical interface for PyOPIA."
authors = [
    { name = "Alex Nimmo Smith", email = "alex@nimmosmith.co.uk" },
]
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.12"
readme = "README.md"
dependencies = [
    "nicegui>=2.0.0",
]

[project.urls]
Repository = "https://github.com/nimmo-smith-technologies/pyopia-gui"

[project.scripts]
pyopia-gui = "pyopia_gui.main:run"
pyopia-gui-native = "pyopia_gui.native_app:run"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.6.0",
]
docs = [
    "mkdocs>=1.6.0",
    "mkdocs-material>=9.5.0",
]
native = [
    "nicegui[native]>=2.0.0",
    "pyinstaller>=6.10.0",
    # Linux has no built-in webview backend (unlike macOS/Windows) - pywebview needs
    # either GTK (a system package, not pip-installable) or Qt (pip-installable) added
    # explicitly there. Verified working: GTK failed with a missing system "gi" module;
    # Qt6 worked with no system packages needed.
    "pywebview[qt6]>=5.0; sys_platform == 'linux'",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pyopia_gui"]

[tool.hatch.version]
path = "src/pyopia_gui/__init__.py"

[tool.pytest.ini_options]
asyncio_mode = "auto"
main_file = "src/pyopia_gui/main.py"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
]

[tool.ruff.format]
quote-style = "double"
